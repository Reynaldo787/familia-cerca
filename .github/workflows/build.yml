name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Bubblewrap
        run: |
          mkdir -p $HOME/.bubblewrap
          cat > $HOME/.bubblewrap/config.json << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${HOME}/android-sdk"
          }
          EOF

      - name: Generate Signing Key
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias familia-cerca \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass familia123 -keypass familia123 \
            -dname "CN=Familia Cerca, OU=Family, O=Familia Cerca, L=City, S=State, C=CU"

      - name: Init Bubblewrap
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | bubblewrap init --manifest twa-manifest.json || true
          ls -la

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | bubblewrap build --skipPwaValidation || true
          echo "=== Archivos APK encontrados ==="
          find . -name "*.apk" -type f
          echo "=== Fin de búsqueda ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: familia-cerca-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn      
